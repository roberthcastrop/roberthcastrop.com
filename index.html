<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roberth Castro | Miami & South Florida REALTOR®</title>

  <meta
    name="description"
    content="Roberth Castro is a Miami REALTOR® with Keller Williams Capital Realty helping buyers, sellers and investors throughout Miami and South Florida."
  >

  <meta name="robots" content="index, follow">
  <meta name="author" content="Roberth Castro">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Roberth Castro">
  <meta property="og:title" content="Roberth Castro | Miami & South Florida REALTOR®">
  <meta property="og:description" content="Roberth Castro is a Miami REALTOR® with Keller Williams Capital Realty helping buyers, sellers and investors throughout Miami and South Florida.">
  <meta property="og:url" content="https://roberthcastrop.com/">
  <meta property="og:image" content="https://roberthcastrop.com/roberth.jpg">

  <link rel="canonical" href="https://roberthcastrop.com/">
  <link rel="icon" href="logo.png">

  <style>
    :root {
      --navy: #071b2f;
      --gold: #c7a04a;
      --text: #14202e;
      --gray: #68717c;
      --light: #f6f6f4;
      --border: #dedede;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #ffffff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 28px;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 22px 0;
      color: #ffffff;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 30px;
      font-size: 13px;
      font-weight: 700;
    }

    .menu a {
      transition: 0.2s;
    }

    .menu a:hover {
      color: var(--gold);
    }

    .mobile-button {
      display: none;
      background: transparent;
      border: 0;
      color: #ffffff;
      font-size: 30px;
      cursor: pointer;
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: 90px;
      left: 20px;
      right: 20px;
      padding: 12px 20px;
      background: var(--navy);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 15px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      font-weight: 700;
    }

    .hero {
      min-height: 700px;
      display: flex;
      align-items: center;
      color: #ffffff;
      background:
        linear-gradient(
          90deg,
          rgba(3, 15, 28, 0.86),
          rgba(3, 15, 28, 0.20)
        ),
        url("luxury-home.jpg");
      background-size: cover;
      background-position: center;
    }

    .hero-content {
      max-width: 780px;
      padding-top: 70px;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 15px 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 70px;
      line-height: 1;
      font-weight: 400;
    }

    .hero p {
      margin: 0 0 30px;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 15px 24px;
      border: 0;
      background: var(--navy);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .btn-white {
      background: #ffffff;
      color: var(--navy);
    }

    .services {
      padding: 50px 0;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .service {
      display: block;
      padding: 25px 40px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .service:last-child {
      border-right: none;
    }

    .service-icon {
      margin-bottom: 15px;
      color: var(--gold);
      font-size: 30px;
    }

    .service h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .service p {
      max-width: 280px;
      margin: 0 auto;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    .section {
      padding: 80px 0;
    }

    .section-title {
      max-width: 760px;
      margin: 0 auto 45px;
      text-align: center;
    }

    .section-title h2 {
      margin: 10px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 400;
    }

    .section-title p {
      color: var(--gray);
      line-height: 1.7;
    }

    .markets {
      background: #ffffff;
    }

    .area-list {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 30px;
      text-align: center;
    }

    .area-list span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      white-space: nowrap;
    }

    .about {
      display: grid;
      grid-template-columns: 46% 54%;
      min-height: 650px;
      background: var(--navy);
    }

    .about-photo {
      min-height: 650px;
      background-image: url("roberth.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .about-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 8%;
      color: #ffffff;
    }

    .about-content h2 {
      margin: 12px 0 25px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 50px;
      line-height: 1.08;
      font-weight: 400;
    }

    .about-content p {
      max-width: 650px;
      margin: 0 0 16px;
      color: #e1e7ec;
      font-size: 15px;
      line-height: 1.75;
    }

    .about-details {
      display: flex;
      gap: 35px;
      flex-wrap: wrap;
      margin: 20px 0 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .about-details strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 400;
    }

    .about-details span {
      display: block;
      margin-top: 5px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .opportunities {
      background: var(--light);
    }

    .opportunity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .opportunity-card {
      display: block;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      transition: 0.25s;
    }

    .opportunity-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    .opportunity-card img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .opportunity-info {
      padding: 25px;
    }

    .opportunity-info h3 {
      margin: 0 0 9px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 400;
    }

    .opportunity-info p {
      margin: 0;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    .sold-section {
      background: #ffffff;
      text-align: center;
    }

    .sold-section h2 {
      margin: 10px 0 15px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 46px;
      font-weight: 400;
    }

    .sold-section p {
      max-width: 600px;
      margin: 0 auto 28px;
      color: var(--gray);
      font-size: 15px;
      line-height: 1.7;
    }

    .sold-button {
      display: inline-block;
      padding: 16px 28px;
      background: var(--navy);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: 0.25s;
    }

    .sold-button:hover {
      background: var(--gold);
      color: var(--navy);
    }

    .contact {
      padding: 80px 0;
      color: #ffffff;
      background:
        linear-gradient(
          rgba(3, 15, 28, 0.88),
          rgba(3, 15, 28, 0.88)
        ),
        url("brickell.jpg");
      background-size: cover;
      background-position: center;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 42% 58%;
      gap: 70px;
      align-items: start;
    }

    .contact h2 {
      margin: 10px 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 400;
    }

    .contact-copy p {
      margin: 0 0 25px;
      color: #e4e8ec;
      line-height: 1.7;
    }

    .direct-contact {
      font-size: 14px;
      line-height: 2;
    }

    .direct-contact a:hover {
      color: var(--gold);
    }

    .contact-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      outline: none;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #d7dce1;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--gold);
    }

    .contact-form textarea {
      grid-column: 1 / -1;
      min-height: 130px;
      resize: vertical;
    }

    .consent-group {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin-bottom: 16px;
    }

    .consent-row:last-child {
      margin-bottom: 0;
    }

    .contact-form .consent-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      margin: 2px 0 0;
      padding: 0;
      cursor: pointer;
      accent-color: var(--gold);
    }

    .consent-row label {
      color: #e4e8ec;
      font-size: 11px;
      line-height: 1.55;
      cursor: pointer;
    }

    .consent-row a {
      color: var(--gold);
      text-decoration: underline;
    }

    .contact-form button {
      grid-column: 1 / -1;
      padding: 17px 25px;
      border: 0;
      background: var(--gold);
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    footer {
      padding: 35px 0;
      background: #030f1b;
      color: #cbd2d9;
      font-size: 12px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .footer-name {
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 700;
    }

    .broker-name {
      margin: 6px 0;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .footer-contact {
      text-align: right;
      line-height: 1.8;
    }

    footer a:hover {
      color: #ffffff;
    }

    .legal-links {
      margin-top: 8px;
    }

    .legal-links a {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .menu {
        display: none;
      }

      .mobile-button {
        display: block;
      }

      .hero {
        min-height: 620px;
      }

      .hero h1 {
        font-size: 50px;
      }

      .services-grid,
      .opportunity-grid {
        grid-template-columns: 1fr;
      }

      .service {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 30px;
      }

      .service:last-child {
        border-bottom: none;
      }

      .about {
        grid-template-columns: 1fr;
      }

      .about-photo {
        min-height: 550px;
      }

      .about-content {
        padding: 60px 30px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .footer-contact {
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .container {
        padding: 0 20px;
      }

      .brand img {
        width: 45px;
        height: 45px;
      }

      .brand {
        font-size: 13px;
      }

      .brand small {
        font-size: 8px;
        letter-spacing: 1.4px;
      }

      .hero {
        min-height: 590px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 17px;
      }

      .section {
        padding: 65px 0;
      }

      .section-title h2 {
        font-size: 35px;
      }

      .area-list {
        display: block;
        text-align: center;
      }

      .area-list span {
        display: block;
        padding: 7px 0;
        font-size: 21px;
      }

      .about-photo {
        min-height: 440px;
      }

      .about-content {
        padding: 55px 25px;
      }

      .about-content h2 {
        font-size: 39px;
      }

      .contact-form {
        grid-template-columns: 1fr;
      }

      .contact-form textarea,
      .contact-form button,
      .consent-group {
        grid-column: 1;
      }
    }
  </style>
